<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">

        <!--SEO meta tags-->
        <meta name="description" content="A grid layout displaying multiple images in different sizes">
        <meta name="keywords" content="grid, layout, images, multiple images">
        <meta name="author" content="Gaia Harb">

        <!-- favicon -->
         <link rel="icon" href="favicon.ico" type="image/x-icon">

         <!-- text shown in browser tab -->
          <title> Image Grid Layout</title>
       
    </head>
    <body>
        <header>
            <h1> Image Grid Layout </h1>
        </header>
        <main>
               <!-- where the image grid layout goes -->
         <div id="grid">
            <img class="tall" src="foggy-beach-rock.avif" alt="A foggy beach with a large rock formation in the foreground">
            <img class="wide" src="food.avif" alt="A table topped with plates and bowls of food">
            <img class="tall" src="white-buildings.avif" alt="A row of white apartment buildings next to a street">
             <img class="tall" src="reddoor-building.avif" alt="A building with a red door and a tree in front of it">
            <img class="wide" src="living-room.avif" alt="A living room with a white couch and a round window">
            <img class="wide" src="beach-view.avif" alt="A view of a beach from the top of a hill">
         </div>
    
        </main>
    </body>
</html>
